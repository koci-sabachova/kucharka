name: Sync recipes from Google Sheets

on:
  schedule:
    - cron: '0 5 * * *'  # daily at 5:00 UTC (6:00 CET / 7:00 CEST)
  workflow_dispatch:      # manual run button in Actions UI for instant sync

permissions:
  contents: write

env:
  SHEET_ID: 1faFus0esZ82J6PjbzuEcImDIqqxkz6GF8vApY2zNsd4
  GID_SIGNATURES: 248177041
  GID_OLD_SIGNATURES: 1744802255
  GID_WORLD_CLASSICS: 0

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download CSVs from Google Sheets
        run: |
          mkdir -p csv
          base="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid="
          curl -sSLf -o csv/signatures.csv      "${base}${GID_SIGNATURES}"
          curl -sSLf -o csv/old_signatures.csv  "${base}${GID_OLD_SIGNATURES}"
          curl -sSLf -o csv/world_classics.csv  "${base}${GID_WORLD_CLASSICS}"
          wc -l csv/*.csv

      - name: Regenerate recipes.json
        run: node parse_csv.js

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add csv data/recipes.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync recipes from Google Sheets"
            git push
            exit 0
          fi
          echo "No recipe changes."
          # GitHub disables scheduled workflows after 60 days with no repo
          # activity — nudge the repo with an empty commit well before that,
          # but only when actually needed (not on every no-op run).
          last_commit_days=$(( ( $(date -u +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$last_commit_days" -ge 30 ]; then
            git commit --allow-empty -m "Keepalive: no recipe changes in ${last_commit_days} days"
            git push
          fi
